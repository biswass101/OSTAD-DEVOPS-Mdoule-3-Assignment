name: Test and Deploy to aws
on:
    push:
        branches:
            - main
jobs:
    test:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout the repo
              uses: actions/checkout@v3

            - name: Install Node Js
              uses: actions/setup-node@v4
              with:
                node-version: '22'

            - name: Install packages
              run: npm install

            - name: Test app and save result
              run: |
                mkdir -p test-results 
                npm run check > test-results/results.txt
            
            - name: Upload test results
              uses: actions/upload-artifact@v4
              with:
                name: results
                path: test-results/results.txt

    deploy:
        needs: test
        runs-on: self-hosted
        steps:
            - name: Checkout the Code
              uses: actions/checkout@v3
            
            - name: Download test results
              uses: actions/download-artifact@v4
              with:
                name: test-results
            
            - name: Display test results
              run: cat results/results.txt
            
            - name: Install The Packages
              run: npm install
            
            - name: Run the app by PM2
              run: |
                ls -a
                pm2 status
                pm2 delete node-app || true
                pm2 start "npm start" --name="node-app"
                pm2 save
            