name: Test artifact
on:
    push:
        branches:
            - main

jobs:
    build:
        runs-on: ubunbut-latest
        steps:
            - uses: actions/checkout@v3

            - name: Build project
              run: |
                mkdir output
                echo "Project Builded" > output/hello.txt
            
            - name: Upload artifact
              uses: actions/upload-artifact@v3
              with:
                name: my-artifact
                path: output/

    deploy:
        runs-on: ubunbut-latest
        needs: build
        steps:
            - uses: actions/checkout@v3

            - name: Download Artifact
              uses: actions/download-artifact@v3
              with:
                name: my-artifact
            - name: Show files
              run: ls 
